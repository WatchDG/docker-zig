name: Build and Push Docker Image

on:
  workflow_dispatch:
    inputs:
      zig_version:
        description: 'Zig version (e.g., 0.15.2)'
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Zig version
        id: zig_version
        run: |
          echo "version=${{ inputs.zig_version }}" >> $GITHUB_OUTPUT
          echo "Using Zig version: ${{ inputs.zig_version }}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            watchdg/zig:v${{ steps.zig_version.outputs.version }}
            watchdg/zig:latest
          build-args: |
            ZIG_VERSION=${{ steps.zig_version.outputs.version }}
